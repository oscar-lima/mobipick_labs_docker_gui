[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mobipick-labs-docker-gui"
version = "0.1.0"
description = "PyQt5 desktop controller for the Mobipick Labs Docker simulation"
readme = "README.md"
requires-python = ">=3.8"
authors = [{name = "Mobipick Labs"}]
license = {text = "Proprietary"}
dependencies = [
    "PyQt5>=5.15",
    "PyYAML>=6.0",
    "importlib-resources>=5.0; python_version < '3.9'",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
    "Topic :: Software Development :: User Interfaces",
]
keywords = ["mobipick", "docker", "gui", "ros", "simulation"]

[project.urls]
Homepage = "https://github.com/oscar-lima/mobipick_labs_docker_gui"
Repository = "https://github.com/oscar-lima/mobipick_labs_docker_gui"

[project.scripts]
mobipick-labs-docker-gui = "mobipick_gui.cli:main"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.package-data]
mobipick_gui = [
    "resources/clean.bash",
    "resources/custom_entrypoint.sh",
    "resources/docker-compose.yml",
    "resources/enter_container_manually_test.sh",
    "resources/config/*.yaml",
    "resources/empty_workspace/.gitkeep",
    "resources/scripts/enter_host_shell.py",
    "resources/scripts/ros_workspace_setup.bash",
    "resources/scripts/terminal.bashrc",
]

[tool.setuptools.exclude-package-data]
mobipick_gui = [
    "resources/private/**",
    "resources/log/**",
    "**/__pycache__/**",
    "**/*.pyc",
]

[tool.setuptools.packages.find]
include = ["mobipick_gui", "mobipick_gui.*"]
exclude = ["mobipick_gui.resources.private*"]
namespaces = false

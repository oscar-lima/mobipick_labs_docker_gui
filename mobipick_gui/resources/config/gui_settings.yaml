log:
  max_block_count: 20000        # keep this many lines in each log tab before older ones are trimmed
  flush_interval_ms: 30         # how often the log widget flushes buffered text to the screen (lower = more frequent updates)
  background_color: "#000000"   # log tab background color
  text_color: "#ffffff"         # default text color for plain log lines
  gui_log_color: "#ff00ff"      # color for GUI-generated status messages
  command_log_color: "#4da3ff"  # color for command lines emitted by the GUI
  font_family: "monospace"      # font family used for log text
  scroll_tolerance_min: 2       # how close (in scroll units) the user must be to the bottom for auto-scroll to stay enabled

window:
  geometry: [100, 100, 1100, 780]   # main window position (x, y) and size (width, height)
  maximized: false                   # remember whether the main window was maximized
  title: "Mobipick Labs Control"    # title displayed on the window chrome

ros:
  remote_master_uri: "http://mobipick-os-sensor:11311"  # default external ROS 1 master shown in the GUI
  remote_service: "mobipick_remote_cmd"                 # host-networked compose service used for remote ROS tools
  remote_enabled_by_default: false                      # keep local roscore/simulation mode selected on startup

window_layout:
  state_file: "~/.config/mobipick-labs-docker-gui/window_layouts/{workspace}.yaml"  # writable per-workspace window positions
  auto_apply: true                                      # when true, apply saved sizes/positions to matching windows after they appear
  apply_delay_ms: "auto"                                # "auto" applies the layout 1 second after all auto-launch processes are ready

recording:
  enabled_by_default: false             # leave "Record Auto Launch" unchecked on startup
  workspace_name: "workspace"           # replaced by the active workspace name when one is selected
  output_dir: "~/.local/share/mobipick-labs-docker-gui/recordings"
  remember_output_dir: false            # when false, checking "Record Auto Launch" asks where to save recordings
  display: ""                           # X11 display for ffmpeg x11grab; empty uses the GUI process DISPLAY
  show_control_window: true             # pop up an always-on-top Stop Recording window while recording
  resolution: "3440x1440"               # default ffmpeg capture resolution (-s)
  presets: ["1920x1080", "2560x1440", "3440x1440"]  # options shown in the resolution dropdown
  include_detected_resolution: true     # when true, add the detected primary monitor resolution as a selectable option

display:
  mode: "auto"                          # auto prefers X11/XWayland; use x11 or wayland to force one Qt backend

timers:
  poll_ms: 1200                     # interval for the UI poller that updates button state, etc.
  sigint_check_ms: 100              # how often we check for Ctrl+C from the launch terminal
  custom_tab_sigint_delay_ms: 1000  # delay before sending docker stop after SIGINT for custom tabs
  sim_shutdown_delay_ms: 2500       # wait time before running fallback shutdown steps for the sim

buttons:
  sim_toggle:
    padding_px: 6                   # padding applied to the Start/Stop Sim button
    disabled_opacity: 0.85          # visual opacity when the button is disabled
    states:
      green: { bg: "#28a745", fg: "white" }   # colors when sim is running (Stop Sim)
      red:   { bg: "#dc3545", fg: "white" }   # colors when sim is stopped (Start Sim)
      yellow: { bg: "#ffc107", fg: "black" }  # colors during transitional states (waiting)
      grey:  { bg: "#6c757d", fg: "white" }   # fallback colors when state is unknown
  close:
    text: "✕"                                  # label for the small tab close buttons
    tooltip: "Close tab"                       # hover text for close buttons
    size: 18                                   # close button width/height in pixels
    stylesheet: "QPushButton { border: none; padding: 0px; }"  # Qt stylesheet for close buttons
  config_file: "config/button_commands_labs.yaml"  # workspace-specific profiles are configured in the workspace manager

process:
  qprocess_env:
    COMPOSE_IGNORE_ORPHANS: "1"               # environment injected into every QProcess we spawn
  compose_run_env:
    PYTHONUNBUFFERED: "1"                     # exported into docker compose runs to force unbuffered stdout
    PYTHONIOENCODING: "UTF-8"                 # ensure python subprocesses emit UTF-8
    MOBIPICK_ROS_USE_IP: "1"                  # advertise container bridge IPs instead of disposable Docker hostnames

terminal:
  launcher: "gnome-terminal --title \"{title}\" -- bash -lc \"{command}\""  # external terminal command template
  title: "Mobipick Terminal"                # substituted into the launcher template
  container_prefix: "mobipick-terminal"     # prefix used when naming one-off terminal containers
  drop_to_host_user: true                    # when false, the GUI keeps terminals running as root inside the container

setup_wizard:
  show_on_first_run: true                    # open setup when user settings have not marked it complete
  public_images:                             # images the wizard can pull for image-default testing
    - "ozkrelo/x_mobipick_labs:noetic-v1.1"
    - "ozkrelo/x_mobipick_labs:noetic-v1.2"
  development_base_image: "ozkrelo/x_mobipick_labs:noetic-v1.2"
  development_image_repository: "ozkrelo/x_mobipick_labs"
  development_image_tag_template: "{user}_user_from_1.2"
  source_repository: "https://github.com/DFKI-NI/mobipick_labs.git"
  source_branch: "noetic"
  source_workspace_name: "clean_mobipick_labs_ws"
  source_image: ""                           # empty uses the wizard's custom-image target by default
  source_install_by_default: false           # preselect the source clone/build step when true

images:
  default: "ozkrelo/x_mobipick_labs:noetic-v1.1" # portable base image selected on first launch
  discovery_filters: ["mobipick"]                 # repository substrings used to filter docker images for the dropdown
  blacklist: []                               # image refs/patterns ignored by setup and image discovery, e.g. ["*n8n*"]
  include_none_tag: false                     # include dangling (<none>) tags in the image list when true
  related_container_keywords: ["mobipick", "mobipick_cmd", "mobipick-run", "rqt", "rviz"]  # container name fragments treated as related
  related_image_keywords: ["mobipick_labs"]  # extra image substrings treated as related for cleanup
  manage_dialog_detail: simple                # level of detail shown in the Manage Images dialog (simple, medium, full)
  default_user: root                           # unknown images run as root unless a profile opts into the host user
  default_supports_host_workspaces: false      # root-only images use the workspace baked into the image
  # supports_host_workspaces controls whether a private host workspace may be mounted.
  # compatible_workspaces controls only the green "workspace match" highlight.
  profiles:
    - ref: "ozkrelo/mobipick_labs:noetic"
      user: root
      supports_host_workspaces: false
      compatible_workspaces: ["Docker image default"]
      workdir: "/root/catkin_ws"
      description: "Public image with a root-owned workspace baked into the image."
    - ref: "ozkrelo/x_mobipick_labs:noetic-v1.1"
      user: root
      supports_host_workspaces: false
      compatible_workspaces: ["Docker image default"]
      workdir: "/root/catkin_ws"
      description: "Public X11 image with a root-owned workspace baked into the image."
    - ref: "ozkrelo/x_mobipick_labs:noetic-v1.2"
      user: root
      supports_host_workspaces: false
      compatible_workspaces: ["Docker image default"]
      workdir: "/root/catkin_ws"
      description: "Public X11 image with a root-owned workspace baked into the image."
    - match: "*_user*"
      user: host
      supports_host_workspaces: true
      compatible_workspaces: []
      description: "Fallback for local development images with a user matching the host."

worlds:
  default: "moelk_tables"                    # default world_config if none is selected

exit:
  dialog_title: "Shutting Down"                       # window title shown during exit cleanup
  dialog_message: "Shutting down simulation and cleaning up. Please wait..."  # body text while we tear down containers
  log_start_message: "Shutting down containers before exit..."                # console message when exit sequence begins
  log_done_message: "Shutdown complete. Exiting..."                          # console message once cleanup finishes
  docker_stop_timeout: 3                               # seconds docker stop waits before force killing containers (lower = faster exit)

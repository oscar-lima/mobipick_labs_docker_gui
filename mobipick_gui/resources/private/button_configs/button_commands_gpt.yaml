buttons:
  - key: sim
    label: "Sim"
    kind: builtin
    action: sim
    tooltip: "Start or stop the simulator container"
  - key: rviz
    label: "RViz"
    kind: builtin
    action: rviz
    tooltip: "Open RViz with the pick and place configuration"
  - key: rqt
    label: "RQt Tables"
    kind: builtin
    action: rqt_tables
    tooltip: "Open the RQt tables demo UI"
  - key: gpt_experiments
    label: "GPT Experiments GUI"
    kind: command
    command: "roslaunch mobipick_gpt_experiments command_gui.launch"
    tooltip: "Launch the GPT experiments GUI"
    requires_roscore: true
    reuse_tab: false
    world_config_required: true
    world_arg_name: "world_name"
  - key: gpt_robot_demo
    label: "GPT Robot Demo"
    kind: command
    command: "roslaunch mobipick_gpt gpt_robot_demo.launch"
    tooltip: "Launch a demo where GPT controls the robot"
    requires_roscore: true
    reuse_tab: false
    world_config_required: false
    world_arg_name: "world_name"
    setup: "source /home/oscar/ros_ws/gpt_ws/src/key_sourcerer.sh"
  - key: piper_tts
    label: "Piper TTS"
    kind: command
    command: "docker compose -f $HOME/repos_cloned/piper_tts_docker/docker-compose.yml up piper"
    tooltip: "Start the Piper TTS container"
    requires_roscore: false
    reuse_tab: false
    world_config_required: false
    host: true
    stop_command: "docker compose -f $HOME/repos_cloned/piper_tts_docker/docker-compose.yml stop piper && docker compose -f $HOME/repos_cloned/piper_tts_docker/docker-compose.yml rm -f piper"
  - key: whisper_ros_sim
    label: "Whisper ROS (Sim)"
    kind: command
    command: "docker compose -f $HOME/repos_cloned/whisper_ros_docker/docker-compose.yml up --remove-orphans --renew-anon-volumes --no-deps --detach whisper"
    log_command: "docker compose -f $HOME/repos_cloned/whisper_ros_docker/docker-compose.yml logs -f whisper"
    tooltip: "Run whisper_ros against the simulator"
    requires_roscore: false
    reuse_tab: false
    world_config_required: false
    host: true
    stop_command: "docker compose -f $HOME/repos_cloned/whisper_ros_docker/docker-compose.yml stop whisper && docker compose -f $HOME/repos_cloned/whisper_ros_docker/docker-compose.yml rm -f whisper"
    pass_ros_master_uri: true
